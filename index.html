<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1><b><i>Tic-Tac-Toe</i></b></h1>

    <div class ="container">

   

        <div class ="sidebar">
            
            <!-- Game Selection -->
            <label class ="mode_heading">Game Mode  : </label>
            <br>
            <select id="mode">
                <option value="pvp">Player vs Player</option>
                <option value="pvc">Player vs Computer</option>
            </select>
            
            <!-- Player1 input  -->
            <label class ="mode_heading" >Player X Name:</label>
            <br>
            <input type="text" id="player1" placeholder="Player X" autocomplete="off" >
            <br>

            <!-- Player2 input  -->
            <label class ="mode_heading" >Player O Name:</label>
            <br>
            <input type="text" id="player2" placeholder="Player O"autocomplete="off" >
            <br>

            <!-- voice  -->
            <button id="voiceBtn">🎤 Speak Move</button>

        </div>

        <div class = "game">

            <div class="button"></div>
            <div class="button"></div>
            <div class="button"></div>
            <div class="button"></div>
            <div class="button"></div>
            <div class="button"></div>
            <div class="button"></div>
            <div class="button"></div>
            <div class="button"></div>

        </div>

     </div>

        <button class="reset"> <i><b>RESET</b></i></button>

        <script src="script.js" defer></script>
</body>
</html>
